<!doctype html>
<html lang="en">
  <head>
    <script>document.documentElement.setAttribute("data-theme","dark");</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>GlitchIt Admin — AI Workers & Analytics</title>
    <link rel="stylesheet" href="src/styles.css?v=10" />
    <link rel="stylesheet" href="src/design-system.css?v=1" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }

      /* Login Gate */
      .login-gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
      .login-card { width: 100%; max-width: 400px; background: #101010; border: 1px solid #242424; border-radius: 24px; padding: 40px 32px; }
      .login-brand { text-align: center; margin-bottom: 32px; }
      .login-brand .icon { font-size: 48px; background: linear-gradient(135deg, #00a743, #008737); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .login-brand h1 { font-size: 24px; margin-top: 8px; }
      .login-brand p { color: #8e8e8e; font-size: 14px; margin-top: 4px; }
      .login-field { margin-bottom: 16px; }
      .login-field label { display: block; font-size: 12px; font-weight: 700; color: #8e8e8e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
      .login-field input { width: 100%; padding: 14px 16px; border: 1px solid #242424; border-radius: 12px; background: #151515; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s; }
      .login-field input:focus { border-color: #008737; }
      .login-btn { width: 100%; padding: 14px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #00a743, #008737); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.15s, filter 0.15s; }
      .login-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
      .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .login-error { color: #ff3b30; font-size: 13px; text-align: center; margin-top: 12px; display: none; }

      /* Dashboard */
      .dashboard { display: none; padding: 24px; max-width: 1200px; margin: 0 auto; }
      .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
      .dash-header h1 { font-size: 28px; }
      .dash-header .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #00c853; }
      .dash-header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #00c853; animation: pulse 2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      .dash-logout { padding: 8px 16px; border: 1px solid #242424; border-radius: 999px; background: transparent; color: #8e8e8e; font-size: 13px; font-weight: 700; cursor: pointer; }
      .dash-logout:hover { border-color: #ff3b30; color: #ff3b30; }

      /* Stats Grid */
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
      .stat-card { background: #101010; border: 1px solid #242424; border-radius: 16px; padding: 20px; }
      .stat-card .label { font-size: 12px; color: #8e8e8e; text-transform: uppercase; letter-spacing: 0.05em; }
      .stat-card .value { font-size: 28px; font-weight: 900; margin-top: 4px; }
      .stat-card .sub { font-size: 12px; color: #626262; margin-top: 4px; }

      /* Workers Section */
      .section { margin-bottom: 32px; }
      .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .section-header h2 { font-size: 20px; }
      .section-header button { padding: 8px 16px; border: 1px solid #242424; border-radius: 999px; background: transparent; color: #008737; font-size: 12px; font-weight: 700; cursor: pointer; }
      .section-header button:hover { background: rgba(0, 135, 55, 0.1); }

      .worker-card { background: #101010; border: 1px solid #242424; border-radius: 16px; padding: 20px; margin-bottom: 12px; }
      .worker-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .worker-name { font-weight: 800; font-size: 15px; }
      .worker-status { font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 700; }
      .worker-status.active { background: rgba(0, 200, 83, 0.15); color: #00c853; }
      .worker-status.idle { background: rgba(142, 142, 142, 0.15); color: #8e8e8e; }
      .worker-desc { font-size: 13px; color: #8e8e8e; margin-bottom: 12px; }
      .worker-insights { max-height: 200px; overflow-y: auto; }
      .insight { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #151515; font-size: 13px; }
      .insight:last-child { border-bottom: none; }
      .insight-icon { font-size: 16px; flex-shrink: 0; width: 24px; text-align: center; }
      .insight-text { flex: 1; }
      .insight-text strong { display: block; margin-bottom: 2px; }
      .insight-text small { color: #626262; }
      .severity-success .insight-icon { color: #00c853; }
      .severity-warning .insight-icon { color: #ffab00; }
      .severity-critical .insight-icon { color: #ff3b30; }
      .severity-info .insight-icon { color: #00c853; }
      .severity-opportunity .insight-icon { color: #008737; }

      /* Charts */
      .chart-container { background: #101010; border: 1px solid #242424; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
      .chart-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
      .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
      .bar { flex: 1; background: linear-gradient(to top, #008737, #00a743); border-radius: 4px 4px 0 0; min-height: 4px; position: relative; transition: height 0.3s ease; }
      .bar-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #626262; white-space: nowrap; }
      .bar-value { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #8e8e8e; white-space: nowrap; }

      /* Reports queue */
      .reports-meta { font-size: 12px; color: #8e8e8e; margin-bottom: 12px; }
      .reports-meta b { color: #ffab00; }
      .report-card { background: #101010; border: 1px solid #242424; border-radius: 16px; padding: 16px 20px; margin-bottom: 10px; }
      .report-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
      .report-type { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(255, 59, 48, 0.15); color: #ff3b30; text-transform: uppercase; }
      .report-status { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
      .report-status.open { background: rgba(255, 171, 0, 0.15); color: #ffab00; }
      .report-status.acknowledged { background: rgba(0, 200, 83, 0.15); color: #00c853; }
      .report-status.dismissed { background: rgba(142, 142, 142, 0.15); color: #8e8e8e; }
      .report-reason { font-weight: 800; font-size: 14px; }
      .report-note { font-size: 13px; color: #8e8e8e; margin: 6px 0; }
      .report-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .report-who { font-size: 12px; color: #626262; }
      .report-actions { display: flex; gap: 8px; }
      .report-actions button { padding: 6px 14px; border: 1px solid #242424; border-radius: 999px; background: transparent; color: #8e8e8e; font-size: 12px; font-weight: 700; cursor: pointer; }
      .report-actions button:hover { border-color: #008737; color: #008737; }
      .report-actions button.danger:hover { border-color: #ff3b30; color: #ff3b30; }

      /* Log */
      .log-container { background: #101010; border: 1px solid #242424; border-radius: 16px; padding: 20px; max-height: 300px; overflow-y: auto; }
      .log-entry { font-size: 12px; font-family: 'SF Mono', Monaco, monospace; padding: 4px 0; border-bottom: 1px solid #151515; color: #8e8e8e; }
      .log-entry .time { color: #626262; margin-right: 8px; }
      .log-entry .worker { color: #008737; margin-right: 8px; }

      @media (max-width: 768px) {
        .stats-grid { grid-template-columns: repeat(2, 1fr); }
        .dash-header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <!-- Login Gate -->
    <div class="login-gate" id="login-gate">
      <div class="login-card">
        <div class="login-brand">
          <div class="icon">ϟ</div>
          <h1>GlitchIt Admin</h1>
          <p>AI Workers & Analytics Dashboard</p>
        </div>
        <div class="login-field">
          <label>Username</label>
          <input type="text" id="admin-user" placeholder="Enter username" autocomplete="username" />
        </div>
        <div class="login-field">
          <label>Password</label>
          <input type="password" id="admin-pass" placeholder="Enter password" autocomplete="current-password" />
        </div>
        <button type="button" class="login-btn" id="login-btn">Sign In</button>
        <div class="login-error" id="login-error">Invalid credentials</div>
      </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
      <div class="dash-header">
        <div>
          <h1>⚡ AI Workers Dashboard</h1>
          <div class="status"><span class="dot"></span>Workers Active — Running 24/7</div>
        </div>
        <button type="button" class="dash-logout" id="logout-btn">Sign Out</button>
      </div>

      <!-- Overall Stats -->
      <div class="stats-grid" id="stats-grid"></div>

      <!-- Charts -->
      <div class="section">
        <div class="section-header">
          <h2>📈 7-Day Trends</h2>
          <button type="button" id="refresh-btn">↻ Refresh</button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="chart-container">
            <div class="chart-title">Daily Views</div>
            <div class="bar-chart" id="views-chart"></div>
          </div>
          <div class="chart-container">
            <div class="chart-title">Daily Engagements</div>
            <div class="bar-chart" id="engagements-chart"></div>
          </div>
        </div>
      </div>

      <!-- AI Workers -->
      <div class="section">
        <div class="section-header">
          <h2>🤖 AI Workers</h2>
          <button type="button" id="run-workers-btn">▶ Run All Now</button>
        </div>
        <div id="workers-container"></div>
      </div>

      <!-- Worker Logs -->
      <div class="section">
        <div class="section-header">
          <h2>📋 Worker Logs</h2>
          <button type="button" id="clear-logs-btn">Clear</button>
        </div>
        <div class="log-container" id="log-container"></div>
      </div>

      <!-- Trust & Safety: user reports queue -->
      <div class="section">
        <div class="section-header">
          <h2>🛡️ Reports Queue</h2>
          <button type="button" id="reports-refresh-btn">↻ Refresh</button>
        </div>
        <div class="reports-meta" id="reports-meta"></div>
        <div id="reports-container"></div>
      </div>
    </div>

    <script src="src/analytics.js?v=1"></script>
    <script src="src/ai-workers.js?v=1"></script>
    <script src="src/admin.js?v=2"></script>
  </body>
</html>
