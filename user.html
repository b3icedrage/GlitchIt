<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="src/styles.css?v=5" />
    <link rel="stylesheet" href="src/bottombar.css?v=2" />
    <link rel="stylesheet" href="src/db.css" />
    <link rel="stylesheet" href="src/profile-media.css" />
    <link rel="stylesheet" href="src/user-profile.css" />
  </head>
  <body data-page="user">
    <div id="app">
      <aside class="sidebar">
        <a class="brand" href="index.html"><span class="icon" aria-hidden="true">ϟ</span>GlitchIt</a>
        <nav>
          <a href="index.html"><span class="icon" aria-hidden="true">⌂</span><span>Home</span></a>
          <a href="search.html"><span class="icon" aria-hidden="true">⌕</span><span>Search</span></a>
          <a href="glitches.html"><span class="icon" aria-hidden="true">▣</span><span>Glitches</span></a>
          <a href="messages.html"><span class="icon" aria-hidden="true">✉</span><span>Messages</span></a>
          <a href="live.html"><span class="icon" aria-hidden="true">◉</span><span>Live</span></a>
          <a href="activity.html"><span class="icon" aria-hidden="true">♡</span><span>Activity</span></a>
          <a href="shop.html"><span class="icon" aria-hidden="true">◒</span><span>Shop</span></a>
          <a class="active" href="profile.html"><span class="icon" aria-hidden="true">◎</span><span>Profile</span></a>
        </nav>
      </aside>

      <main>
        <div class="mobile-top">
          <a class="brand" href="index.html"><span class="icon" aria-hidden="true">ϟ</span>GlitchIt</a>
          <div class="mobile-top-actions">
            <a href="activity.html" class="top-activity-btn" aria-label="Activity"><span class="icon" aria-hidden="true">♡</span></a>
            <a href="messages.html" class="top-dm-btn" aria-label="Messages"><span class="icon" aria-hidden="true">✉</span></a>
          </div>
        </div>

        <section class="profile-panel page" id="user-profile" data-page="user" aria-labelledby="user-top-name">
          <div class="profile-content">
            <div class="user-topbar">
              <button type="button" class="user-back" id="user-back" aria-label="Back">‹</button>
              <strong id="user-top-name">Profile</strong>
              <span class="user-topbar-spacer" aria-hidden="true"></span>
            </div>

            <div class="profile-header">
              <div class="user-photo">
                <img id="user-avatar" src="" alt="Profile picture">
              </div>
              <div class="profile-summary">
                <div class="profile-metrics">
                  <span><b data-u-stat="posts">0</b>posts</span>
                  <span><b data-u-stat="followers">0</b>followers</span>
                  <span><b data-u-stat="following">0</b>following</span>
                </div>
              </div>
            </div>

            <div class="profile-bio">
              <strong class="profile-name" id="user-name">…</strong>
              <span></span>
              <p>Creator on GlitchIt</p>
            </div>

            <div class="profile-actions-row user-actions">
              <button type="button" class="user-follow-btn" id="user-follow-btn">Follow</button>
            </div>

            <div class="profile-tabs" role="tablist" aria-label="Profile media">
              <button type="button" class="profile-tab active" id="user-tab-posts" aria-label="Posts" aria-selected="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><em class="profile-tab-count" id="user-count-posts">0</em></button>
              <button type="button" class="profile-tab" id="user-tab-reels" aria-label="Reels" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M7 2v5M12 2v5M17 2v5M2 12h20"/><path d="M10 15.5l5-3-5-3z"/></svg><em class="profile-tab-count" id="user-count-reels">0</em></button>
            </div>

            <div class="profile-grid" id="user-grid" aria-label="Posts">
              <p class="profile-empty">Loading profile…</p>
            </div>
          </div>
        </section>
      </main>

      <aside class="right-rail">
        <div class="me"><img src="" alt="Your profile"><div><strong>you</strong><span>GlitchIt creator</span></div></div>
        <div class="stats"><span><b data-stat="followers">0</b> followers</span><span><b data-stat="drops">0</b> drops</span></div>
        <div class="rail-head"><h3>Suggested for you</h3><a href="activity.html">See all</a></div>
        <div class="rail-suggestions"></div>
      </aside>

      <nav class="bottom-bar" aria-label="Primary mobile navigation">
        <a href="index.html"><span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10"/></svg></span><span>Home</span></a>
        <a href="search.html"><span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span><span>Search</span></a>
        <a href="messages.html"><span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span>Messages</span></a>
        <a href="glitches.html" class="glitch-nav-btn"><span class="nav-icon"><svg class="glitch-play-icon" viewBox="0 0 48 48" width="26" height="26"><defs><radialGradient id="glow-grad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#d62976" stop-opacity="0.6"/><stop offset="100%" stop-color="#4f5bd5" stop-opacity="0"/></radialGradient><filter id="glow-filter"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#d62976" flood-opacity="0.8"/></filter></defs><circle cx="24" cy="24" r="22" fill="url(#glow-grad)" class="glow-pulse"/><circle cx="24" cy="24" r="21" fill="#1a1a2e" stroke="#d62976" stroke-width="1.5" filter="url(#glow-filter)"/><polygon points="19,14 19,34 35,24" fill="#fff" filter="url(#glow-filter)"/></svg></span><span>Glitches</span></a>
        <a href="shop.html"><span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span><span>Shop</span></a>
        <a href="profile.html" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>Profile</span></a>
      </nav>
    </div>
    <script src="src/main.js?v=23" defer></script>
    <script src="src/profile-avatar.js" defer></script>
  </body>
</html>
