      <main>
        <div class="mobile-top">
          <a class="brand" href="index.html"><span class="icon" aria-hidden="true">ϟ</span>GlitchIt</a>
          <div class="mobile-top-actions">
            <a href="activity.html" class="top-activity-btn" aria-label="Activity"><span class="icon" aria-hidden="true">♡</span></a>
            <a href="messages.html" class="top-dm-btn" aria-label="Messages"><span class="icon" aria-hidden="true">✉</span></a>
          </div>
        </div>

        <section class="profile-panel page" id="user-profile" data-page="user" aria-labelledby="user-top-name">
          <div class="profile-content">
            <div class="user-topbar">
              <button type="button" class="user-back" id="user-back" aria-label="Back">‹</button>
              <strong id="user-top-name">Profile</strong>
              <span class="user-topbar-spacer" aria-hidden="true"></span>
            </div>

            <div class="profile-header">
              <div class="user-photo">
                <img id="user-avatar" src="" alt="Profile picture">
              </div>
              <div class="profile-summary">
                <div class="profile-metrics">
                  <span><b data-u-stat="posts">0</b>posts</span>
                  <span><b data-u-stat="followers">0</b>followers</span>
                  <span><b data-u-stat="following">0</b>following</span>
                </div>
              </div>
            </div>

            <div class="profile-bio">
              <strong class="profile-name" id="user-name">…</strong>
              <span></span>
              <p id="user-bio-text">Creator on GlitchIt</p>
            </div>

            <div class="profile-actions-row user-actions">
              <button type="button" class="user-follow-btn" id="user-follow-btn">Follow</button>
              <button type="button" class="user-msg-btn" id="user-msg-btn" hidden>Message</button>
            </div>

            <div class="profile-tabs" role="tablist" aria-label="Profile media">
              <button type="button" class="profile-tab active" id="user-tab-posts" aria-label="Posts" aria-selected="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><em class="profile-tab-count" id="user-count-posts">0</em></button>
              <button type="button" class="profile-tab" id="user-tab-reels" aria-label="Reels" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M7 2v5M12 2v5M17 2v5M2 12h20"/><path d="M10 15.5l5-3-5-3z"/></svg><em class="profile-tab-count" id="user-count-reels">0</em></button>
            </div>

            <div class="profile-grid" id="user-grid" aria-label="Posts">
              <p class="profile-empty">Loading profile…</p>
            </div>
          </div>
        </section>
      </main>

      <aside class="right-rail">
        <div class="me"><img src="" alt="Your profile"><div><strong>you</strong><span>GlitchIt creator</span></div></div>
        <div class="stats"><span><b data-stat="followers">0</b> followers</span><span><b data-stat="drops">0</b> drops</span></div>
        <div class="rail-head"><h3>Suggested for you</h3><a href="activity.html">See all</a></div>
        <div class="rail-suggestions"></div>
      </aside>
