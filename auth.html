<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · GlitchIt</title>
  <link rel="stylesheet" href="src/styles.css?v=9">
  <link rel="stylesheet" href="src/auth.css?v=3">
  <script>
    // Prevent redirect loops - if we're stuck, clear auth state
    try {
      const attempts = parseInt(sessionStorage.getItem('glitchit.auth.attempts') || '0');
      if (attempts > 3) {
        sessionStorage.removeItem('glitchit.auth.attempts');
        localStorage.removeItem('glitchit.auth.session.v1');
      } else {
        sessionStorage.setItem('glitchit.auth.attempts', String(attempts + 1));
      }
    } catch(e) {}
  </script>
</head>
<body data-page="auth">
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-mark">ϟ</div>
      <h1>GlitchIt</h1>
      <p class="auth-sub">Sign in to your account</p>

      <form id="auth-form" novalidate>
        <!-- Email field -->
        <div class="auth-field">
          <label for="auth-email">Email</label>
          <input 
            type="email" 
            id="auth-email" 
            name="email" 
            autocomplete="email" 
            placeholder="you@example.com"
            required
          >
        </div>

        <!-- Password field -->
        <div class="auth-field">
          <label for="auth-password">Password</label>
          <div class="auth-password">
            <input 
              type="password" 
              id="auth-password" 
              name="password" 
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >
            <button type="button" id="auth-toggle-password" class="auth-eye" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember me -->
        <div class="auth-remember">
          <label class="auth-remember-label">
            <input type="checkbox" id="auth-remember" name="remember">
            <span>Remember me</span>
          </label>
        </div>

        <!-- Error message -->
        <div id="auth-error" class="auth-error" hidden></div>

        <!-- Submit button -->
        <button type="submit" id="auth-submit" class="auth-submit">
          Sign In
        </button>
      </form>

      <!-- Guest option -->
      <div class="auth-guest">
        <span>— or —</span>
        <button type="button" id="auth-guest">Continue as guest</button>
      </div>

      <!-- Sign up link -->
      <p class="auth-foot">
        Don't have an account? <a href="#" id="auth-switch">Sign up</a>
      </p>
    </div>
  </div>

  <script src="src/main.js?v=38" defer></script>
  <script>
    // Inline script for immediate UI feedback
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('auth-form');
      const emailInput = document.getElementById('auth-email');
      const passwordInput = document.getElementById('auth-password');
      const toggleBtn = document.getElementById('auth-toggle-password');
      const rememberCb = document.getElementById('auth-remember');
      const guestBtn = document.getElementById('auth-guest');
      const switchLink = document.getElementById('auth-switch');
      const errorEl = document.getElementById('auth-error');
      const submitBtn = document.getElementById('auth-submit');

      // Restore remembered email
      try {
        const remembered = localStorage.getItem('glitchit.auth.remember');
        if (remembered && emailInput) {
          emailInput.value = remembered;
          if (rememberCb) rememberCb.checked = true;
        }
      } catch(e) {}

      // Password visibility toggle
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });
      }

      // Guest button
      if (guestBtn) {
        guestBtn.addEventListener('click', function() {
          try { localStorage.setItem('glitchit.auth.guest.v1', '1'); } catch(e) {}
          window.location.href = 'index.html';
        });
      }

      // Switch to sign up (for now, just show message)
      if (switchLink) {
        switchLink.addEventListener('click', function(e) {
          e.preventDefault();
          alert('Sign up is available through the app. Please create your account there.');
        });
      }
    });
  </script>
</body>
</html>
