<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in · GlitchIt</title>
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="stylesheet" href="src/bottombar.css?v=2" />
    <link rel="stylesheet" href="src/auth.css?v=2" />
  </head>
  <body data-page="auth">
    <div class="auth-page">
      <div class="auth-card">
        <span class="auth-mark" aria-hidden="true">ϟ</span>
        <h1>GlitchIt</h1>
        <p class="auth-sub">Create · Drop · Glitch</p>

        <div class="auth-tabs" role="tablist" aria-label="Account">
          <button type="button" class="auth-tab active" data-auth-mode="login" role="tab" aria-selected="true">Log in</button>
          <button type="button" class="auth-tab" data-auth-mode="signup" role="tab" aria-selected="false">Sign up</button>
        </div>

        <form id="auth-form" novalidate>
          <div class="auth-field" id="auth-username-field" hidden>
            <label for="auth-username">Username</label>
            <input id="auth-username" name="username" autocomplete="username" />
          </div>
          <div class="auth-field">
            <label for="auth-email">Email</label>
            <input id="auth-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="auth-field">
            <label for="auth-password">Password</label>
            <div class="auth-password">
              <input id="auth-password" name="password" type="password" autocomplete="current-password" required />
              <button type="button" id="auth-toggle-password" class="auth-eye" aria-label="Show password" aria-pressed="false">
                <svg class="auth-eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="auth-eye-closed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <p class="auth-error" id="auth-error" role="alert" hidden></p>
          <button type="submit" class="auth-submit" id="auth-submit">Log in</button>
        </form>

        <div class="auth-guest">
          <span>— or —</span>
          <button type="button" id="auth-guest">Continue without an account</button>
        </div>
      </div>
      <p class="auth-foot">Guests can browse read-only. Sign in to follow, like, comment, share, post, message, and shop.</p>
    </div>
    <script src="src/main.js?v=18" defer></script>
    <script src="src/profile-avatar.js" defer></script>
    <script>
      // Auth page micro-interactions: SVG password eye + tab-switch re-entry animation.
      (function () {
        var input = document.getElementById('auth-password');
        var eye = document.getElementById('auth-toggle-password');
        var form = document.getElementById('auth-form');
        document.addEventListener('click', function (event) {
          var target = event.target;
          if (!target || typeof target.closest !== 'function') return;
          if (target.closest('#auth-toggle-password') && input && eye) {
            // Own the eye toggle here (capture phase) so main.js's legacy
            // emoji handler never runs and cannot clobber the SVG icons.
            event.stopImmediatePropagation();
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            eye.setAttribute('aria-pressed', String(show));
            eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            var open = eye.querySelector('.auth-eye-open');
            var closed = eye.querySelector('.auth-eye-closed');
            if (open) open.hidden = !show;
            if (closed) closed.hidden = show;
            return;
          }
          if (target.closest('.auth-tab') && form) {
            form.classList.remove('auth-swap');
            void form.offsetWidth;
            form.classList.add('auth-swap');
          }
        }, true);
      })();
    </script>
  </body>
</html>
