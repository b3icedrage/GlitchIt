  <body data-page="chat">
    <div id="app">
      <aside class="sidebar">
        <a class="brand" href="index.html"><span class="icon" aria-hidden="true">ϟ</span>GlitchIt</a>
        <nav>
          <a href="index.html"><span class="icon" aria-hidden="true">⌂</span><span>Home</span></a>
          <a href="search.html"><span class="icon" aria-hidden="true">⌕</span><span>Search</span></a>
          <a href="glitches.html"><span class="icon" aria-hidden="true">▣</span><span>Glitches</span></a>
          <a class="active" href="messages.html"><span class="icon" aria-hidden="true">✉</span><span>Messages</span></a>
          <a href="live.html"><span class="icon" aria-hidden="true">◉</span><span>Live</span></a>
          <a href="activity.html"><span class="icon" aria-hidden="true">♡</span><span>Activity</span></a>
          <a href="shop.html"><span class="icon" aria-hidden="true">◒</span><span>Shop</span></a>
          <a href="profile.html"><span class="icon" aria-hidden="true">◎</span><span>Profile</span></a>
        </nav>
      </aside>

      <main>
        <section class="page" id="chat" data-page="chat" aria-labelledby="chat-name">
          <div class="chat-screen">
            <header class="chat-top">
              <a class="chat-back" href="messages.html" aria-label="Back to messages">‹</a>
              <a class="chat-user" href="profile.html">
                <img class="chat-avatar" src="" alt="New conversation avatar">
                <span class="chat-id">
                  <strong id="chat-name">New conversation</strong>
                  <em>Start chatting with a creator</em>
                </span>
              </a>
              <div class="chat-actions">
                <button type="button" class="chat-act" data-call="audio" aria-label="Audio call">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </button>
                <button type="button" class="chat-act" data-call="video" aria-label="Video call">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                </button>
              </div>
            </header>

            <div class="chat-body" id="chat-body">
              <div class="chat-empty"><span class="chat-empty-mark">✉</span><h3>No conversation yet</h3><p>Pick someone from your inbox or tap the camera to start a new chat.</p></div>
            </div>

            <footer class="chat-bar">
              <button type="button" class="chat-cam" aria-label="Take a photo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </button>
              <button type="button" class="chat-icon" id="chat-loc" aria-label="Share location" title="Share location">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              </button>
              <input class="chat-input" id="chat-input" type="text" aria-label="Message" autocomplete="off" />
              <button type="button" class="chat-icon" aria-label="Voice message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              </button>
              <button type="button" class="chat-icon" aria-label="Gallery">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              </button>
              <button type="button" class="chat-icon" aria-label="Stickers and emoji">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
              </button>
              <button type="button" class="chat-icon" aria-label="More">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </footer>

            <div class="home-indicator" aria-hidden="true"></div>
          </div>
        </section>
      </main>

      <aside class="right-rail">
        <div class="me"><img src="" alt="Your profile"><div><strong>you</strong><span>GlitchIt creator</span></div></div>
        <div class="stats"><span><b data-stat="followers">0</b> followers</span><span><b data-stat="drops">0</b> drops</span></div>
        <div class="rail-head"><h3>Suggested for you</h3><a href="activity.html">See all</a></div>
        <div class="rail-suggestions"></div>
      </aside>

      <nav class="ig-bottom-bar" aria-label="Primary navigation">

        <a href="camera.html" class="ig-tab" data-tab="create"><span class="ig-tab-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></span></a>
        <a href="messages.html" class="ig-tab active" data-tab="messages"><span class="ig-tab-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3L9.218 10.083M11.698 20.334L22 3.001H2l9.218 7.083m.48 10.25l1.525-5.833L22 3"/></svg></span></a>
        <a href="search.html" class="ig-tab" data-tab="search"><span class="ig-tab-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span></a>
        <a href="profile.html" class="ig-tab" data-tab="profile"><span class="ig-tab-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span></a>
      </nav>
