<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="gMain" x1="120" y1="100" x2="400" y2="420">
      <stop offset="0%" stop-color="#69f0ae"/>
      <stop offset="25%" stop-color="#008737"/>
      <stop offset="50%" stop-color="#00e676"/>
      <stop offset="75%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <linearGradient id="gShine" x1="180" y1="120" x2="380" y2="380">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>
    <linearGradient id="metalEdge" x1="150" y1="130" x2="370" y2="400">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="50%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="2" dy="4"/>
      <feGaussianBlur stdDeviation="4"/>
      <feComposite operator="out" in="SourceGraphic"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="80" y="80" width="352" height="352" rx="72" ry="72"/>
    </clipPath>
  </defs>

  <!-- App icon background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" fill="none" stroke="#262626" stroke-width="2"/>

  <!-- Subtle texture -->
  <g clip-path="url(#iconClip)" opacity="0.06">
    <line x1="80" y1="120" x2="432" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="80" y1="160" x2="432" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="80" y1="200" x2="432" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="80" y1="240" x2="432" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="80" y1="280" x2="432" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="80" y1="320" x2="432" y2="320" stroke="#fff" stroke-width="0.5"/>
    <line x1="80" y1="360" x2="432" y2="360" stroke="#fff" stroke-width="0.5"/>
    <line x1="80" y1="400" x2="432" y2="400" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- G letter - base shape -->
  <g clip-path="url(#iconClip)" filter="url(#glow)">
    <!-- Main G body -->
    <path d="M340 165 C340 130 305 105 260 105 C200 105 155 145 155 210 L155 302 C155 367 200 407 260 407 C305 407 340 382 340 347 L270 347 C270 362 258 372 243 372 C225 372 215 357 215 330 L215 182 C215 155 225 140 243 140 C258 140 270 150 270 165 Z" 
          fill="url(#gMain)" filter="url(#innerShadow)"/>
    <!-- G horizontal bar -->
    <rect x="265" y="265" width="100" height="38" rx="4" fill="url(#gMain)" filter="url(#innerShadow)"/>
    <!-- Shine overlay -->
    <path d="M340 165 C340 130 305 105 260 105 C200 105 155 145 155 210 L155 302 C155 367 200 407 260 407 C305 407 340 382 340 347 L270 347 C270 362 258 372 243 372 C225 372 215 357 215 330 L215 182 C215 155 225 140 243 140 C258 140 270 150 270 165 Z" 
          fill="url(#gShine)" opacity="0.5"/>
  </g>

  <!-- Glitch fragmentation pieces -->
  <g clip-path="url(#iconClip)">
    <!-- Small scattered fragments -->
    <rect x="135" y="155" width="18" height="6" rx="1" fill="#69f0ae" opacity="0.7" transform="rotate(-8 144 158)"/>
    <rect x="125" y="175" width="12" height="4" rx="1" fill="#00e676" opacity="0.6" transform="rotate(5 131 177)"/>
    <rect x="145" y="190" width="8" height="8" rx="1" fill="#008737" opacity="0.5"/>
    <rect x="130" y="210" width="15" height="3" rx="1" fill="#00e676" opacity="0.65" transform="rotate(-3 137 211)"/>
    <rect x="140" y="240" width="10" height="5" rx="1" fill="#00c853" opacity="0.55"/>
    <rect x="128" y="265" width="20" height="4" rx="1" fill="#00e676" opacity="0.5" transform="rotate(2 138 267)"/>

    <!-- Top left scatter -->
    <rect x="158" y="120" width="6" height="12" rx="1" fill="#69f0ae" opacity="0.6" transform="rotate(12 161 126)"/>
    <rect x="175" y="115" width="4" height="8" rx="1" fill="#008737" opacity="0.5"/>
    <rect x="195" y="110" width="8" height="4" rx="1" fill="#00e676" opacity="0.45" transform="rotate(-6 199 112)"/>

    <!-- Right edge scatter -->
    <rect x="350" y="180" width="14" height="5" rx="1" fill="#00e676" opacity="0.6" transform="rotate(4 357 182)"/>
    <rect x="360" y="210" width="8" height="8" rx="1" fill="#00c853" opacity="0.55"/>
    <rect x="355" y="250" width="12" height="3" rx="1" fill="#00e676" opacity="0.5" transform="rotate(-7 361 251)"/>
    <rect x="365" y="290" width="10" height="4" rx="1" fill="#69f0ae" opacity="0.6"/>
    <rect x="350" y="330" width="16" height="5" rx="1" fill="#008737" opacity="0.5" transform="rotate(3 358 332)"/>

    <!-- Bottom scatter -->
    <rect x="200" y="410" width="8" height="6" rx="1" fill="#00e676" opacity="0.55"/>
    <rect x="230" y="415" width="12" height="3" rx="1" fill="#00e676" opacity="0.5" transform="rotate(-4 236 416)"/>
    <rect x="280" y="412" width="6" height="8" rx="1" fill="#00c853" opacity="0.6"/>
    <rect x="310" y="405" width="10" height="4" rx="1" fill="#69f0ae" opacity="0.45" transform="rotate(6 315 407)"/>

    <!-- Pixel dust particles -->
    <rect x="148" y="142" width="3" height="3" fill="#fff" opacity="0.5"/>
    <rect x="162" y="168" width="2" height="2" fill="#69f0ae" opacity="0.7"/>
    <rect x="358" y="195" width="3" height="3" fill="#00e676" opacity="0.6"/>
    <rect x="372" y="240" width="2" height="2" fill="#008737" opacity="0.65"/>
    <rect x="135" y="280" width="3" height="3" fill="#00e676" opacity="0.5"/>
    <rect x="365" y="310" width="2" height="2" fill="#00c853" opacity="0.55"/>
    <rect x="245" y="418" width="2" height="2" fill="#fff" opacity="0.4"/>
    <rect x="290" y="408" width="3" height="3" fill="#00e676" opacity="0.5"/>

    <!-- Glitch scan lines -->
    <line x1="155" y1="185" x2="340" y2="185" stroke="#69f0ae" stroke-width="1" opacity="0.15"/>
    <line x1="155" y1="260" x2="340" y2="260" stroke="#00e676" stroke-width="1" opacity="0.12"/>
    <line x1="155" y1="340" x2="340" y2="340" stroke="#00e676" stroke-width="1" opacity="0.1"/>
  </g>
</svg>