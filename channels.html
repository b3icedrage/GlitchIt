      <main>
        <div class="mobile-top">

          </div>
        </div>

        <section class="page channels-page" id="channels" data-page="channels" aria-labelledby="channels-title">
          <header class="channels-top" id="channels-top">
            <a class="channels-back" href="activity.html" aria-label="Back to activity">‹</a>
            <h1 id="channels-title">Discover channels</h1>
            <span class="channels-top-spacer" aria-hidden="true"></span>
          </header>

          <div class="channels-content">
            <!-- Featured topic card -->
            <article class="ch-feature">
              <div class="ch-feature-art" aria-hidden="true">
                <span class="ch-feature-sun" aria-hidden="true"></span>
                <span class="ch-feature-mark">👚</span>
              </div>
              <div class="ch-feature-info">
                <span class="ch-feature-badge" aria-hidden="true">👗</span>
                <div>
                  <strong>Fashion</strong>
                  <em>Suggested topic • 97 Channels</em>
                </div>
              </div>
            </article>

            <!-- Topics -->
            <section class="channels-section" aria-labelledby="ch-topics-title">
              <h2 id="ch-topics-title">Topics</h2>
              <div class="ch-topics" id="ch-topics" role="group" aria-label="Channel topics"></div>
            </section>

            <!-- Suggested for you -->
            <section class="channels-section" aria-labelledby="ch-suggested-title">
              <div class="channels-sec-head">
                <h2 id="ch-suggested-title">Suggested for you</h2>
                <button type="button" class="ch-seeall" data-seeall="suggested">See all</button>
              </div>
              <div class="ch-list" id="ch-suggested"></div>
            </section>

            <!-- Popular now -->
            <section class="channels-section" aria-labelledby="ch-popular-title">
              <div class="channels-sec-head">
                <h2 id="ch-popular-title">Popular now</h2>
                <button type="button" class="ch-seeall" data-seeall="popular">See all</button>
              </div>
              <div class="ch-list" id="ch-popular"></div>
            </section>
          </div>
        </section>
      </main>

      <aside class="right-rail">
        <div class="me"><img src="" alt="Your profile"><div><strong>you</strong><span>GlitchIt creator</span></div></div>
        <div class="stats"><span><b data-stat="followers">0</b> followers</span><span><b data-stat="drops">0</b> drops</span></div>
        <div class="rail-head"><h3>Suggested for you</h3><a href="activity.html">See all</a></div>
