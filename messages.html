<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="src/bottombar.css?v=2" />
    <link rel="stylesheet" href="src/messages.css" />
    <link rel="stylesheet" href="src/dm-inbox.css" />
    <link rel="stylesheet" href="src/ai-chat.css" />
    <link rel="stylesheet" href="src/music-ui.css?v=2" />
  </head>
  <body data-page="messages" data-ai-fab>
    <div id="app">
      <aside class="sidebar">
        <a class="brand" href="index.html"><span class="icon" aria-hidden="true">ϟ</span>GlitchIt</a>
        <nav>
          <a href="index.html"><span class="icon" aria-hidden="true">⌂</span><span>Home</span></a>
          <a href="search.html"><span class="icon" aria-hidden="true">⌕</span><span>Search</span></a>
          <a href="glitches.html"><span class="icon" aria-hidden="true">▣</span><span>Glitches</span></a>
          <a class="active" href="messages.html"><span class="icon" aria-hidden="true">✉</span><span>Messages</span></a>
          <a href="live.html"><span class="icon" aria-hidden="true">◉</span><span>Live</span></a>
          <a href="activity.html"><span class="icon" aria-hidden="true">♡</span><span>Activity</span></a>
          <a href="shop.html"><span class="icon" aria-hidden="true">◒</span><span>Shop</span></a>
          <a href="profile.html"><span class="icon" aria-hidden="true">◎</span><span>Profile</span></a>
        </nav>
      </aside>

      <main>
        <section class="page" id="messages" data-page="messages" aria-labelledby="dm-title">
          <div class="dm-inbox">
            <header class="dm-top">
              <button type="button" class="dm-menu" id="dm-menu" aria-label="Menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h10"/><circle cx="19.5" cy="18" r="2.1" fill="currentColor" stroke="none"/></svg>
              </button>
              <button type="button" class="dm-title" id="dm-title">
                <span class="handle-text">you</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="dm-head-actions">
                <a href="activity.html" class="dm-act" aria-label="Activity">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 2 5-7"/></svg>
                </a>
                <button type="button" class="dm-act" id="dm-compose" aria-label="New message">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                </button>
              </div>
            </header>

            <div class="dm-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input id="dm-search-input" type="search" aria-label="Search conversations" autocomplete="off" />
            </div>

            <section class="messages-notes" aria-label="Notes from your circle">
              <div class="notes-shelf messages-notes-shelf" id="messages-notes-shelf"></div>
            </section>

            <div class="dm-tabs" role="tablist" aria-label="Message inbox">
              <button type="button" class="dm-filter-pill" aria-label="Filter conversations">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <button type="button" class="dm-tab active" role="tab" aria-selected="true"><span class="dm-tab-dot" aria-hidden="true"></span>Primary<span class="dm-tab-count"></span></button>
              <button type="button" class="dm-tab" role="tab" aria-selected="false">Requests</button>
              <button type="button" class="dm-tab" role="tab" aria-selected="false">General</button>
            </div>

            <div class="dm-list" id="dm-list">
              <div class="dm-empty"><span class="dm-empty-mark">✉</span><h3>No messages yet</h3><p>Start a conversation with a creator you follow and it will show up here.</p></div>
            </div>

            <button type="button" class="dm-compose-fab" id="dm-compose-fab" aria-label="New message">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </section>
      </main>

      <aside class="right-rail">
        <div class="me"><img src="" alt="Your profile"><div><strong>you</strong><span>GlitchIt creator</span></div></div>
        <div class="stats"><span><b data-stat="followers">0</b> followers</span><span><b data-stat="drops">0</b> drops</span></div>
        <div class="rail-head"><h3>Suggested for you</h3><a href="activity.html">See all</a></div>
        <div class="rail-suggestions"></div>
      </aside>

      <nav class="bottom-bar" aria-label="Primary mobile navigation">
        <a href="index.html"><span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10"/></svg></span><span>Home</span></a>
        <a href="search.html"><span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span><span>Search</span></a>
        <a href="messages.html" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span>Messages</span></a>
        <a href="glitches.html" class="glitch-nav-btn"><span class="nav-icon"><svg class="glitch-play-icon" viewBox="0 0 48 48" width="26" height="26"><defs><radialGradient id="glow-grad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#d62976" stop-opacity="0.6"/><stop offset="100%" stop-color="#4f5bd5" stop-opacity="0"/></radialGradient><filter id="glow-filter"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#d62976" flood-opacity="0.8"/></filter></defs><circle cx="24" cy="24" r="22" fill="url(#glow-grad)" class="glow-pulse"/><circle cx="24" cy="24" r="21" fill="#1a1a2e" stroke="#d62976" stroke-width="1.5" filter="url(#glow-filter)"/><polygon points="19,14 19,34 35,24" fill="#fff" filter="url(#glow-filter)"/></svg></span><span>Glitches</span></a>
        <a href="shop.html"><span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span><span>Shop</span></a>
        <a href="profile.html"><span class="nav-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>Profile</span></a>
      </nav>
    </div>
    <script src="src/main.js?v=20" defer></script>
    <script src="src/music-ui.js?v=2" defer></script>
    <script src="src/profile-avatar.js" defer></script>
    <script src="src/notes-story-enhancements.js" defer></script>
    <script src="src/ai-chat.js?v=3" defer></script>
    <script>
      // Inbox micro-interactions: tabs + live search filter.
      (function () {
        var tabs = document.querySelectorAll('.dm-tab');
        tabs.forEach(function (tab) {
          tab.addEventListener('click', function () {
            tabs.forEach(function (t) {
              t.classList.remove('active');
              t.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
          });
        });
        var composeBtns = document.querySelectorAll('#dm-compose, #dm-compose-fab');
        composeBtns.forEach(function (btn) {
          btn.addEventListener('click', function () {
            var s = document.getElementById('dm-search-input');
            if (s) { s.focus(); s.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
          });
        });
        var search = document.getElementById('dm-search-input');
        var rows = document.querySelectorAll('.dm-row');
        if (search && rows.length) {
          search.addEventListener('input', function () {
            var q = search.value.trim().toLowerCase();
            rows.forEach(function (row) {
              row.classList.toggle('none', q.length > 0 && !row.textContent.toLowerCase().includes(q));
            });
          });
        }
      })();
    </script>
  </body>
</html>
