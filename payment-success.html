<!doctype html>
<html lang="en">
  <head>
    <script>document.documentElement.setAttribute("data-theme","dark");</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Payment Successful — GlitchIt Verified</title>
    <link rel="stylesheet" href="src/styles.css?v=9" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 32px 20px;
        text-align: center;
      }

      .success-ring {
        position: relative;
        width: 140px;
        height: 140px;
        margin: 0 auto 28px;
      }
      .success-ring .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: #007d33;
        border-right-color: #00a743;
        animation: spin 1.4s linear infinite;
      }
      .success-ring .ring-inner {
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00a743, #007d33);
        display: grid;
        place-items: center;
        animation: pulse-glow 2s ease-in-out infinite;
      }
      .success-ring .bolt {
        font-size: 44px;
        line-height: 1;
        filter: drop-shadow(0 0 12px rgba(0, 125, 51, 0.6));
      }
      .success-ring .check-mark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 40px;
        animation: pop-in 0.4s 0.8s forwards;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px rgba(0, 125, 51, 0.3), 0 0 40px rgba(0, 167, 67, 0.15); }
        50% { box-shadow: 0 0 30px rgba(0, 125, 51, 0.5), 0 0 60px rgba(0, 167, 67, 0.3); }
      }
      @keyframes pop-in {
        0% { transform: translate(-50%, -50%) scale(0); }
        70% { transform: translate(-50%, -50%) scale(1.2); }
        100% { transform: translate(-50%, -50%) scale(1); }
      }
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .success-title {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 8px;
        animation: fade-up 0.5s 0.3s both;
      }
      .success-title span {
        background: linear-gradient(135deg, #00a743, #007d33, #00e676);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .success-sub {
        font-size: 15px;
        color: #8e8e8e;
        max-width: 340px;
        margin: 0 auto 24px;
        line-height: 1.5;
        animation: fade-up 0.5s 0.5s both;
      }

      .badge-preview {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 14px 22px;
        margin-bottom: 28px;
        animation: fade-up 0.5s 0.7s both;
      }
      .badge-preview .avatar-placeholder {
        position: relative;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, #333, #555);
        overflow: visible;
      }
      .badge-preview .avatar-placeholder img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
      }
      .badge-preview .mini-bolt {
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00a743, #007d33);
        color: #fff;
        font-size: 11px;
        display: grid;
        place-items: center;
        box-shadow: 0 0 0 2px #0a0a0a, 0 2px 8px rgba(0,0,0,0.4);
        z-index: 2;
      }
      .badge-preview .name-area {
        text-align: left;
      }
      .badge-preview .name-area .display-name {
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .badge-preview .name-area .display-name .inline-bolt {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00a743, #007d33);
        color: #fff;
        font-size: 9px;
        display: inline-grid;
        place-items: center;
        flex-shrink: 0;
      }
      .badge-preview .name-area .handle {
        font-size: 13px;
        color: #8e8e8e;
      }

      .expiry-info {
        font-size: 13px;
        color: #626262;
        margin-bottom: 32px;
        animation: fade-up 0.5s 0.9s both;
      }

      .go-home-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 36px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #00a743, #007d33);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.2s, box-shadow 0.2s;
        animation: fade-up 0.5s 1.1s both;
      }
      .go-home-btn:hover {
        transform: scale(1.04);
        box-shadow: 0 6px 24px rgba(0, 125, 51, 0.4);
      }

      .confetti {
        position: fixed;
        top: -10px;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        animation: confetti-fall linear forwards;
        pointer-events: none;
        z-index: 100;
      }
      @keyframes confetti-fall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <!-- Confetti will be injected here -->

    <div class="success-ring">
      <div class="ring"></div>
      <div class="ring-inner">
        <span class="bolt">⚡</span>
      </div>
      <div class="check-mark">✅</div>
    </div>

    <h1 class="success-title">You're now <span>GlitchIt Verified!</span></h1>
    <p class="success-sub">Your payment was successful. The blue verified badge is now active on your profile for 30 days.</p>

    <div class="badge-preview">
      <div class="avatar-placeholder" id="badge-avatar">
        <img id="badge-avatar-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23333'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%23555'/%3E%3Cellipse cx='50' cy='75' rx='26' ry='20' fill='%23555'/%3E%3C/svg%3E" alt="" />
        <div class="mini-bolt">⚡</div>
      </div>
      <div class="name-area">
        <div class="display-name" id="badge-name">
          <span id="badge-name-text">You</span>
          <span class="inline-bolt">⚡</span>
        </div>
        <div class="handle" id="badge-handle">@glitchit</div>
      </div>
    </div>

    <p class="expiry-info" id="expiry-info">Valid for 30 days</p>

    <a href="index.html" class="go-home-btn" id="go-home">
      <span>Go to Home</span>
      <span>→</span>
    </a>

    <script src="src/main.js?v=43" defer></script>
    <script>
      // Wait for main.js to set window.GLITCHIT_USER (loaded by other pages)
      function getUser() {
        return window.GLITCHIT_USER || null;
      }

      function isPremiumActive(userId) {
        if (!userId) return false;
        try {
          var raw = localStorage.getItem('glitchit.premium.' + userId);
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.expiresAt && Date.now() < data.expiresAt) return true;
          }
        } catch (e) {}
        var user = getUser();
        if (user && user.user_metadata && user.user_metadata.premium) {
          var p = user.user_metadata.premium;
          if (p.expiresAt && Date.now() < p.expiresAt) return true;
        }
        return false;
      }

      function activatePremium(expiresAtIso) {
        var expiresAt = expiresAtIso ? new Date(expiresAtIso).getTime() : Date.now() + 30 * 24 * 60 * 60 * 1000;
        var premData = { plan: 'monthly', activatedAt: Date.now(), expiresAt: expiresAt };
        var user = getUser();
        var userId = user && user.id ? user.id : null;

        // 1. ALWAYS store in localStorage (works immediately on next page load)
        if (userId) {
          try { localStorage.setItem('glitchit.premium.' + userId, JSON.stringify(premData)); } catch(e) {}
        }

        // 2. Try Supabase user_metadata (persists across devices)
        if (window.GLITCHIT_AUTH && window.GLITCHIT_AUTH.updateUserMetadata) {
          window.GLITCHIT_AUTH.updateUserMetadata({ premium: premData })
            .then(function() { showActivated(expiresAt); })
            .catch(function() { showActivated(expiresAt); });
        } else {
          showActivated(expiresAt);
        }
      }

      function showActivated(expiresAt) {
        var expiryDate = new Date(expiresAt);
        var daysLeft = Math.ceil((expiresAt - Date.now()) / (1000 * 60 * 60 * 24));
        document.getElementById('expiry-info').textContent = 'Your verified badge is active for ' + daysLeft + ' days (until ' + expiryDate.toLocaleDateString() + ')';
      }

      function init() {
        var user = getUser();
        var email = '';
        var userId = null;

        if (user && !user.guest) {
          email = user.email || '';
          userId = user.id;
          var handle = (user.user_metadata && user.user_metadata.username) || email.split('@')[0] || 'You';
          var avatar = (user.user_metadata && (user.user_metadata.avatar_url || user.user_metadata.avatar || user.user_metadata.picture)) || '';

          document.getElementById('badge-name-text').textContent = handle;
          document.getElementById('badge-handle').textContent = '@' + handle;
          if (avatar) {
            document.getElementById('badge-avatar-img').src = avatar;
          }
        }

        if (userId && isPremiumActive(userId)) {
          document.getElementById('expiry-info').textContent = 'Your verified badge is active!';
          return;
        }

        if (!email) {
          document.getElementById('expiry-info').textContent = 'Sign in to activate your badge';
          return;
        }

        // Poll check-premium until verified
        var attempts = 0;
        var maxAttempts = 40;
        var pollInterval = setInterval(function() {
          attempts++;
          if (attempts > maxAttempts) {
            clearInterval(pollInterval);
            document.getElementById('expiry-info').textContent = 'Payment verification pending - check again in a few minutes';
            return;
          }
          fetch('/api/payment/check-premium?email=' + encodeURIComponent(email))
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.ok && data.active) {
                clearInterval(pollInterval);
                activatePremium(data.expiresAt);
              }
            })
            .catch(function() {});
        }, 3000);
      }

      // Try immediately or wait for GLITCHIT_USER
      if (window.GLITCHIT_USER) {
        init();
      } else {
        var waitCount = 0;
        var waitInterval = setInterval(function() {
          waitCount++;
          if (window.GLITCHIT_USER || waitCount > 30) {
            clearInterval(waitInterval);
            init();
          }
        }, 200);
      }

      // Confetti
      var colors = ['#00a743', '#007d33', '#00e676', '#00a743', '#008737', '#00e676', '#ffd600'];
      for (var i = 0; i < 50; i++) {
        var el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (2 + Math.random() * 3) + 's';
        el.style.animationDelay = (Math.random() * 1.5) + 's';
        el.style.width = (6 + Math.random() * 6) + 'px';
        el.style.height = (6 + Math.random() * 6) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        document.body.appendChild(el);
        setTimeout(function(e) { e.remove(); }.bind(null, el), 5000);
      }
    </script></script>
  </body>
</html>
